name: Firebase-Testversion veroeffentlichen
on:
  workflow_dispatch:
    inputs:
      migrations_verified:
        description: 'Phasen 1–3 live migriert, Sicherung/Rollen geprüft?'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: heimfriseur-firebase-test
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/firebase-spark' && inputs.migrations_verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run test:firebase
      - run: npm run build:firebase
      - run: npx playwright install --with-deps chromium
      - run: npm run test:firebase-browser
      - name: Publish only the existing testsite
        env:
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_ACCOUNT"
          umask 077
          credentials="$RUNNER_TEMP/heimfriseur-firebase-account.json"
          printf '%s' "$FIREBASE_ACCOUNT" > "$credentials"
          trap 'rm -f "$credentials"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          node --input-type=module -e 'import fs from "node:fs";const c=JSON.parse(fs.readFileSync("firebase.parallel.json"));c.hosting.site="heimfriseur-test-237368331242";fs.writeFileSync("firebase.parallel.json",JSON.stringify(c));'
          npx --yes --package firebase-tools@15.32.1 firebase deploy --only hosting --config firebase.parallel.json --project heimfriseur-dayplayer100
