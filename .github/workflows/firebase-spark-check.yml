name: Firebase Spark Testversion pruefen
on:
  push:
    branches: [firebase-spark]
  pull_request:
    branches: [firebase-spark]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:firebase
      - run: npm run build:firebase
      - run: npx playwright install --with-deps chromium
      - name: Firebase mobile flows and keyboard dialogs
        env:
          CHROMIUM_PATH: ''
        run: npm run test:firebase-browser
      - uses: actions/upload-artifact@v4
        with:
          name: heimfriseur-firebase-test
          path: dist-firebase
